name: Update schedules & deploy

# Automation is OFF on purpose: the workflow is disabled and has no push/schedule triggers.
# (zoe.com.ua drops connections from GitHub's servers, so the scrape step can't succeed here.)
# Re-enable with `gh workflow enable` and add triggers back only if that changes.
on:
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data/schedules.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: |
          python -I -m unittest discover -s scraper/tests
          node --test tests/

      - name: Scrape zoe.com.ua
        id: scrape
        continue-on-error: true   # on failure keep deploying the last known data
        run: python scraper/scrape.py

      - name: Warn if scrape failed
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Scraping zoe.com.ua failed - deploying previously committed data"

      - name: Commit refreshed schedules
        run: |
          if ! git diff --quiet -- data/schedules.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedules.json
            git commit -m "Update schedules"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Stage site
        run: |
          mkdir _site
          cp index.html style.css app.js logic.js sw.js favicon.svg manifest.webmanifest _site/
          cp -r icons data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
